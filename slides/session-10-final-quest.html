<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Season 1 Final Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a game HUD strip (XP + quest map) over one quest card at a time, like levels on a spreadsheet grid */
:root {
  --bg: #edf1ef;
  --panel: #ffffff;
  --ink: #142320;
  --muted: #5a6b67;
  --line: #cdd8d4;
  --accent: #0d7a6b;
  --accent-soft: #d6ece7;
  --xp: #b67a00;
  --xp-soft: #f6e8c4;
  --boss: #c13f28;
  --boss-soft: #f8dfd8;
  --good: #1f7a3a;
  --good-soft: #dcefdf;
  --bad: #b3261e;
  --bad-soft: #f7dcda;
  --grid: rgba(13, 122, 107, 0.07);
  --font-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --panel: #16201d; --ink: #e3ece9; --muted: #93a6a1; --line: #2a3a36;
    --accent: #3cc2ad; --accent-soft: #163a34; --xp: #f0b429; --xp-soft: #3a2f12;
    --boss: #ef6a52; --boss-soft: #3d1c16; --good: #5fcf7d; --good-soft: #15321e;
    --bad: #f2867e; --bad-soft: #3c1a18; --grid: rgba(60, 194, 173, 0.06); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --panel: #16201d; --ink: #e3ece9; --muted: #93a6a1; --line: #2a3a36;
  --accent: #3cc2ad; --accent-soft: #163a34; --xp: #f0b429; --xp-soft: #3a2f12;
  --boss: #ef6a52; --boss-soft: #3d1c16; --good: #5fcf7d; --good-soft: #15321e;
  --bad: #f2867e; --bad-soft: #3c1a18; --grid: rgba(60, 194, 173, 0.06); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
}
.wrap { max-width: 860px; margin-inline: auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: 0.01em; }
h2 { font-size: 1.5rem; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* HUD */
.hud { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.hud-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stats { display: flex; gap: 18px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); }
.stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stat.xp b { color: var(--xp); }
.xpbar { height: 10px; border-radius: 999px; background: var(--xp-soft); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: var(--xp); border-radius: 999px; transition: width 0.5s ease; }
.map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.node { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.node .n { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.node .t { font-size: 0.68rem; line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
.node[disabled] { cursor: not-allowed; opacity: 0.45; }
.node.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.node.current { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.node.boss .n { color: var(--boss); }
.node.boss.current { border-color: var(--boss); box-shadow: inset 0 0 0 1px var(--boss); }

/* Quest card */
.quest { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.quest.is-boss { border-color: var(--boss); }
.qhead { display: flex; flex-direction: column; gap: 6px; }
.qhead .eyebrow.boss { color: var(--boss); }
.qintro { color: var(--muted); max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--panel); padding: 10px 18px; border-radius: 8px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.boss { background: var(--boss); border-color: var(--boss); color: #fff; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.feedback { font-weight: 500; padding: 10px 14px; border-radius: 8px; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback.info { background: var(--xp-soft); color: var(--ink); }

/* Quest 1: sortable steps */
.sort { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sort li { display: grid; grid-template-columns: 2.6rem 1fr auto; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 10px 12px; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transition: border-color 0.15s ease, background 0.15s ease; }
.sort li:hover { border-color: var(--accent); }

.sort li.dragging { cursor: grabbing; background: var(--panel); border-color: var(--accent); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18); transform: rotate(-1deg) scale(1.02); }
.sort li.gap { border: 2px dashed var(--accent); background: var(--accent-soft); padding: 0; display: block; cursor: default; }
.sort .grip { color: var(--muted); margin-right: 4px; font-size: 1.1rem; letter-spacing: -2px; }
@media (prefers-reduced-motion: no-preference) {
  .sort li.dropped { animation: drop 0.3s ease; }
  @keyframes drop { from { background: var(--accent-soft); } to { background: var(--bg); } }
}
.sort li.ok { border-color: var(--good); background: var(--good-soft); }
.sort li.no { border-color: var(--bad); background: var(--bad-soft); }
.sort .pos { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
.sort .label { font-weight: 600; }
.sort .label small { display: block; font-weight: 400; color: var(--muted); }
.sort .mv { display: flex; gap: 4px; }
.sort .mv button { width: 2.2rem; height: 2.2rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

/* MCQ */
.qs { display: flex; flex-direction: column; gap: 16px; }
.q { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.q.ok { border: 2px solid var(--good); background: var(--good-soft); }
.q.no { border: 2px solid var(--bad); background: var(--bad-soft); }
.q.no .opt.sel { border-color: var(--bad); background: var(--bad); color: #fff; }
.q.ok .opt.sel { border-color: var(--good); background: var(--good); color: #fff; }
.q.no .numin { border: 2px solid var(--bad); }
.q.ok .numin { border: 2px solid var(--good); }
.mark { font-weight: 600; font-size: 0.9rem; }
.q.no .mark { color: var(--bad); }
.q.ok .mark { color: var(--good); }
.q .prompt { font-weight: 600; }
.q .prompt code, .formula { font-family: var(--font-mono); font-size: 0.92em; background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; }
.opt.mono { font-family: var(--font-mono); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.why { font-size: 0.9rem; color: var(--muted); }
.numin { font: inherit; font-family: var(--font-mono); width: 7rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }

/* Data tables */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.data { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
table.data th { background: var(--accent-soft); color: var(--ink); text-align: left; padding: 6px 10px; font-weight: 500; white-space: nowrap; }
table.data th.rowh { width: 2rem; text-align: center; color: var(--muted); }
table.data td { border-top: 1px solid var(--line); padding: 6px 10px; white-space: nowrap; }
table.data td.rowh { text-align: center; color: var(--muted); background: var(--accent-soft); }
table.spot td.cell { cursor: crosshair; }
table.spot td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
table.spot td.flag { background: var(--xp-soft); outline: 2px solid var(--xp); outline-offset: -2px; }
table.spot td.hit { background: var(--good-soft); outline: 2px solid var(--good); outline-offset: -2px; }
table.spot td.miss { background: var(--bad-soft); outline: 2px solid var(--bad); outline-offset: -2px; }
.found { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.found div { display: flex; gap: 8px; }
.found b { color: var(--good); }

/* Boss */
.memo { border-left: 4px solid var(--boss); background: var(--boss-soft); padding: 14px 16px; border-radius: 0 8px 8px 0; display: flex; flex-direction: column; gap: 8px; }
.memo .from { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.memo-qs { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 6px; }
.bonus { border: 2px dashed var(--xp); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.bonus-tag { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--xp); font-weight: 500; }
.timer { font-family: var(--font-display); font-size: 2rem; font-variant-numeric: tabular-nums; color: var(--boss); }
.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.check label { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 1.1rem; height: 1.1rem; margin-top: 0.2rem; accent-color: var(--boss); }
.locked { text-align: center; padding: 30px 10px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.locked b { font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
.card-out { font-family: var(--font-mono); font-size: 0.82rem; white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; user-select: all; }
.namebox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.namebox input { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; flex: 1 1 14rem; }
.small { font-size: 0.85rem; color: var(--muted); }
.admin { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-size: 0.85rem; color: var(--muted); }
.admin .linkbtn { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 4px; }
.admin input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 10rem; }
.admin .badge { background: var(--xp-soft); color: var(--ink); border: 1px solid var(--xp); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
.admin .err { color: var(--bad); }
.datalink { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.hint { border: 1px solid var(--xp); background: var(--xp-soft); border-radius: 8px; padding: 10px 14px; }
.hint summary { cursor: pointer; font-weight: 600; }
.hint-body { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.hint-body ol { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 4px; }
.hint-body code { font-family: var(--font-mono); font-size: 0.9em; background: var(--panel); padding: 1px 5px; border-radius: 4px; }
.hint .tablebox { background: var(--panel); max-width: 22rem; }
@media (max-width: 520px) {
  .map { grid-template-columns: repeat(3, 1fr); }
  .quest { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .quest { animation: rise 0.35s ease backwards; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="hud" aria-label="Progress">
    <div class="hud-top">
      <div>
        <div class="eyebrow">Data Analytics · Season 1 Final</div>
        <h1>The Final Quest</h1>
      </div>
      <div class="stats">
        <div class="stat xp"><b id="xp">0</b><span>XP</span></div>
        <div class="stat"><b id="cleared">0/5</b><span>Quests</span></div>
        <div class="stat"><b id="clock">0:00</b><span>Elapsed</span></div>
      </div>
    </div>
    <div class="xpbar" aria-hidden="true"><i id="xpfill"></i></div>
    <nav class="map" id="map" aria-label="Quest map"></nav>
  </header>

  <main id="stage"></main>
  <footer class="admin" id="admin"></footer>
</div>

<script>
(function () {
  const QUESTS = [
    { id: 'q1', short: 'Process', title: 'Put the process in order' },
    { id: 'q2', short: 'Cleaning', title: 'Clean it the right way' },
    { id: 'q3', short: 'Spot it', title: 'Spot the problems' },
    { id: 'q4', short: 'Functions', title: 'Pick the function' },
    { id: 'q5', short: 'Charts', title: 'Pick the chart' },
    { id: 'boss', short: 'Boss', title: "Plato's Pizza" }
  ];
  const MAX_XP = 500;
  const KEY = 'season1-final-quest-v1';

  // ---------- state ----------
  const fresh = () => ({ name: '', startedAt: null, current: 'q1', q: {}, bossStart: null, bossChecks: {} });
  let S = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const qs = id => (S.q[id] = S.q[id] || { done: false, tries: 0, xp: 0 });
  const isDone = id => !!(S.q[id] && S.q[id].done);
  const unlocked = id => {
    if (S.admin) return true;
    const i = QUESTS.findIndex(q => q.id === id);
    return i === 0 || isDone(QUESTS[i - 1].id);
  };
  const score = tries => Math.max(40, 100 - 20 * tries);

  const $ = (sel, root = document) => root.querySelector(sel);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => c != null && el.append(c.nodeType ? c : document.createTextNode(c)));
    return el;
  };
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

  // ---------- HUD ----------
  function hud() {
    const xp = QUESTS.reduce((s, q) => s + (S.q[q.id] ? S.q[q.id].xp : 0), 0);
    $('#xp').textContent = xp;
    $('#xpfill').style.width = Math.min(100, xp / MAX_XP * 100) + '%';
    $('#cleared').textContent = QUESTS.slice(0, 5).filter(q => isDone(q.id)).length + '/5';
    const map = $('#map');
    map.innerHTML = '';
    QUESTS.forEach((q, i) => {
      const cls = ['node'];
      if (isDone(q.id)) cls.push('done');
      if (S.current === q.id) cls.push('current');
      if (q.id === 'boss') cls.push('boss');
      const label = q.id === 'boss' ? 'Boss' : String(i + 1);
      map.append(h('button', {
        class: cls.join(' '), disabled: !unlocked(q.id), 'aria-current': S.current === q.id ? 'step' : null,
        'aria-label': `${q.title}${isDone(q.id) ? ', cleared' : unlocked(q.id) ? '' : ', locked'}`,
        onclick: () => { S.current = q.id; save(); render(); }
      }, h('span', { class: 'n' }, isDone(q.id) ? '✓' : unlocked(q.id) ? label : '🔒'), h('span', { class: 't' }, q.short)));
    });
  }
  function tick() {
    const el = $('#clock');
    if (!S.startedAt) { el.textContent = '0:00'; return; }
    const s = Math.floor((Date.now() - S.startedAt) / 1000);
    el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  setInterval(() => { tick(); bossTick(); }, 1000);

  function shell(q, intro, body, opts = {}) {
    const i = QUESTS.findIndex(x => x.id === q.id);
    return h('section', { class: 'quest' + (q.id === 'boss' ? ' is-boss' : ''), 'aria-labelledby': 'qt' },
      h('div', { class: 'qhead' },
        h('div', { class: 'eyebrow' + (q.id === 'boss' ? ' boss' : '') }, q.id === 'boss' ? 'Final boss' : `Quest ${i + 1} of 5 · up to 100 XP`),
        h('h2', { id: 'qt' }, q.title),
        intro ? h('p', { class: 'qintro' }, intro) : null),
      body);
  }

  function nextButton(id) {
    const i = QUESTS.findIndex(q => q.id === id);
    const nx = QUESTS[i + 1];
    return h('button', { class: nx.id === 'boss' ? 'btn boss' : 'btn', onclick: () => { S.current = nx.id; save(); render(); window.scrollTo({ top: 0 }); } },
      nx.id === 'boss' ? 'Face the boss →' : `Next quest →`);
  }

  function completeMsg(id) {
    const st = qs(id);
    return h('div', { class: 'feedback good', role: 'status' }, `Quest cleared · +${st.xp} XP${st.tries ? ` (after ${st.tries} miss${st.tries > 1 ? 'es' : ''})` : ' (first try)'}`);
  }

  // ---------- start screen ----------
  function startScreen() {
    const input = h('input', { id: 'student-name', type: 'text', placeholder: 'Your name', autocomplete: 'name', value: S.name || '' });
    const go = h('button', { class: 'btn', onclick: () => {
      const v = input.value.trim();
      if (!v) { input.focus(); fb.hidden = false; return; }
      S.name = v; S.startedAt = Date.now(); save(); render();
    } }, 'Start the exam');
    const fb = h('div', { class: 'feedback bad', hidden: true }, 'Type your name first so it appears on your results card.');
    return h('section', { class: 'quest' },
      h('div', { class: 'qhead' }, h('div', { class: 'eyebrow' }, 'Before you start'), h('h2', {}, 'Five quests, then the boss')),
      h('p', { class: 'qintro' }, 'Each quest unlocks the next. Every miss costs 20 XP, but you can always try again. Plan about 15 minutes for the quests and 45 for the boss.'),
      h('div', { class: 'namebox' }, input, go), fb);
  }

  // ---------- Quest 1: order the process ----------
  const STEPS = [
    { k: 'define', t: 'Define', s: 'Turn the business question into something you can answer' },
    { k: 'collect', t: 'Collect', s: 'Gather the data you need' },
    { k: 'clean', t: 'Clean', s: 'Fix duplicates, typos, blanks and formats' },
    { k: 'analyze', t: 'Analyze', s: 'Count, total, average, compare' },
    { k: 'visualize', t: 'Visualize', s: 'Show the pattern in a chart' },
    { k: 'interpret', t: 'Interpret / Decide', s: 'Say what it means and what to do' }
  ];
  let q1order = null;
  function quest1(q) {
    const st = qs('q1');
    if (!q1order) q1order = st.done ? STEPS.map(s => s.k) : shuffle(STEPS.map(s => s.k));
    const list = h('ol', { class: 'sort', 'aria-label': 'Steps, in your order' });
    const fb = h('div', { 'aria-live': 'polite' });
    const draw = (marks) => {
      list.innerHTML = '';
      q1order.forEach((k, i) => {
        const step = STEPS.find(s => s.k === k);
        const li = h('li', { 'data-k': k, class: marks ? (marks[i] ? 'ok' : 'no') : '' },
          h('span', { class: 'pos' }, st.done ? null : h('span', { class: 'grip', 'aria-hidden': 'true' }, '⋮⋮'), String(i + 1)),
          h('span', { class: 'label' }, step.t, h('small', {}, step.s)),
          h('span', { class: 'mv' },
            h('button', { 'aria-label': `Move ${step.t} up`, disabled: st.done || i === 0, onclick: () => { move(i, i - 1); } }, '↑'),
            h('button', { 'aria-label': `Move ${step.t} down`, disabled: st.done || i === q1order.length - 1, onclick: () => { move(i, i + 1); } }, '↓')));
        if (!st.done) dragify(li);
        list.append(li);
      });
    };
    const move = (a, b) => { const [x] = q1order.splice(a, 1); q1order.splice(b, 0, x); draw(); };
    // Whole card is the handle: it lifts, follows the pointer, and a dashed gap shows where it will drop.
    function dragify(li) {
      li.addEventListener('pointerdown', e => {
        if (e.button !== 0 || e.target.closest('button')) return;
        e.preventDefault();
        const r = li.getBoundingClientRect();
        const offsetY = e.clientY - r.top;
        const gap = h('li', { class: 'gap', 'aria-hidden': 'true' });
        gap.style.height = r.height + 'px';
        li.before(gap);
        li.classList.add('dragging');
        Object.assign(li.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', zIndex: 50 });
        li.setPointerCapture(e.pointerId);
        let lastY = e.clientY, scroller = null;
        const place = () => {
          li.style.top = (lastY - offsetY) + 'px';
          const others = [...list.children].filter(c => c !== li && c !== gap);
          const before = others.find(c => { const b = c.getBoundingClientRect(); return lastY < b.top + b.height / 2; });
          if (before) { if (gap.nextSibling !== before) before.before(gap); }
          else if (list.lastElementChild !== gap) list.append(gap);
        };
        const autoScroll = () => {
          const edge = 70;
          const v = lastY < edge ? -12 : lastY > innerHeight - edge ? 12 : 0;
          if (v) { window.scrollBy(0, v); place(); }
          scroller = requestAnimationFrame(autoScroll);
        };
        scroller = requestAnimationFrame(autoScroll);
        const onMove = ev => { lastY = ev.clientY; place(); };
        const onUp = () => {
          cancelAnimationFrame(scroller);
          li.removeEventListener('pointermove', onMove);
          li.removeEventListener('pointerup', onUp);
          li.removeEventListener('pointercancel', onUp);
          gap.replaceWith(li);
          li.removeAttribute('style');
          li.classList.remove('dragging');
          q1order = [...list.children].map(c => c.dataset.k);
          draw();
          const moved = list.querySelector(`[data-k="${li.dataset.k}"]`);
          if (moved) { moved.classList.add('dropped'); }
        };
        li.addEventListener('pointermove', onMove);
        li.addEventListener('pointerup', onUp);
        li.addEventListener('pointercancel', onUp);
      });
    }
    draw(st.done ? STEPS.map(() => true) : null);
    const check = h('button', { class: 'btn', onclick: () => {
      const marks = q1order.map((k, i) => k === STEPS[i].k);
      draw(marks);
      const right = marks.filter(Boolean).length;
      if (right === 6) { st.done = true; st.xp = score(st.tries); save(); render(); }
      else { st.tries++; save(); fb.className = 'feedback bad'; fb.textContent = `${right} of 6 in the right spot. Green ones are placed. Move the red ones and check again (−20 XP).`; hud(); }
    } }, 'Check order');
    return shell(q, 'Grab any step and drag it into place. The arrows work too.',
      h('div', { class: 'qs' }, list, st.done ? completeMsg('q1') : fb,
        h('div', { class: 'actions' }, st.done ? nextButton('q1') : check)));
  }

  // ---------- generic MCQ quest ----------
  function mcqQuest(q, intro, items, extra) {
    const st = qs(q.id);
    st.pick = st.pick || {};
    const fb = h('div', { 'aria-live': 'polite' });
    const blocks = items.map((it, idx) => {
      const box = h('div', { class: 'q' + (st.done ? ' ok' : '') });
      const why = h('p', { class: 'why', hidden: !st.done }, it.why);
      const opts = h('div', { class: 'opts', role: 'group', 'aria-label': 'Answer choices' });
      if (it.kind === 'number') {
        const inp = h('input', { class: 'numin', id: `${q.id}-n${idx}`, type: 'text', inputmode: 'decimal', value: st.pick[idx] != null ? st.pick[idx] : '', disabled: st.done,
          oninput: e => { st.pick[idx] = e.target.value.trim(); save(); box.classList.remove('no', 'ok'); mark.textContent = ''; } });
        opts.append(inp);
      } else {
        st.order = st.order || {};
        if (!st.order[idx] || st.order[idx].length !== it.opts.length || !it.opts.every(o => st.order[idx].includes(o))) st.order[idx] = shuffle(it.opts);
        st.order[idx].forEach(o => {
          const b = h('button', { class: 'opt' + (it.mono ? ' mono' : '') + (st.pick[idx] === o ? ' sel' : ''), 'aria-pressed': st.pick[idx] === o ? 'true' : 'false', disabled: st.done,
            onclick: () => { st.pick[idx] = o; save(); [...opts.children].forEach(c => { const on = c.textContent === o; c.classList.toggle('sel', on); c.setAttribute('aria-pressed', on ? 'true' : 'false'); }); box.classList.remove('no', 'ok'); mark.textContent = ''; why.hidden = true; } }, o);
          opts.append(b);
        });
      }
      const mark = h('p', { class: 'mark', 'aria-live': 'polite' }, st.done ? '✓ Correct' : '');
      box.append(h('p', { class: 'prompt', html: it.p }), opts, mark, why);
      box._why = why;
      box._mark = mark;
      return box;
    });
    const check = h('button', { class: 'btn', onclick: () => {
      let right = 0, answered = 0;
      items.forEach((it, idx) => {
        const v = st.pick[idx];
        if (v != null && v !== '') answered++;
        const ok = it.kind === 'number' ? Number(String(v).replace(/[$,]/g, '')) === it.a : v === it.a;
        blocks[idx].classList.toggle('ok', ok);
        blocks[idx].classList.toggle('no', !ok);
        blocks[idx]._mark.textContent = ok ? '✓ Correct' : '✗ Not quite. Pick another answer.';
        if (ok) { right++; blocks[idx]._why.hidden = false; }
      });
      if (answered < items.length) { fb.className = 'feedback info'; fb.textContent = `Answer all ${items.length} before checking. No XP lost.`; items.forEach((it, idx) => { const v = st.pick[idx]; if (v == null || v === '') { blocks[idx].classList.remove('no'); blocks[idx]._mark.textContent = ''; } }); return; }
      if (right === items.length) { st.done = true; st.xp = score(st.tries); save(); render(); }
      else { st.tries++; save(); fb.className = 'feedback bad'; fb.textContent = `${right} of ${items.length} right. Fix the red ones and check again (−20 XP).`; hud(); }
    } }, 'Check answers');
    return shell(q, intro, h('div', { class: 'qs' }, extra || null, ...blocks, st.done ? completeMsg(q.id) : fb,
      h('div', { class: 'actions' }, st.done ? nextButton(q.id) : check)));
  }

            h('tr', {}, h('td', {}, 'orders'), h('td', {}, '21,350')),
            h('tr', {}, h('td', {}, 'order_details'), h('td', {}, '48,620')),
            h('tr', {}, h('td', {}, 'pizzas'), h('td', {}, '96')),
            h('tr', {}, h('td', {}, 'pizza_types'), h('td', {}, '32'))))),
        h('p', { class: 'small' }, 'A different count usually means the header row or a comma caused a problem. Delete the table and import it again.')));
    const bonus = h('div', { class: 'bonus' },
      h('div', { class: 'bonus-tag' }, 'Bonus · optional'),
      h('p', {}, h('b', {}, 'Our supplier is raising the price of mushrooms. How much of our revenue comes from pizzas that use them?')),
      h('p', { class: 'small' }, 'Only try this after the three main questions are done. Add your answer and the query you used at the end of your Google Doc.'));
    const hint2 = h('details', { class: 'hint' },
      h('summary', {}, 'Hint 2: from a SQL result to a chart'),
      h('div', { class: 'hint-body' },
        h('p', {}, 'Run your query so the result is small: one row per pizza, hour or category. Then export it.'),
        h('ol', {},
          h('li', {}, 'In SQLite Online, choose ', h('b', {}, 'Export → CSV'), '.'),
          h('li', {}, 'Before exporting, tick ', h('b', {}, 'Column name is first line'), '. Without it, your file has no headers and the chart won\'t know what each column is.'),
          h('li', {}, 'Open the CSV. In Google Sheets: File → Import → Upload → Insert new sheet. In Excel: open the file.'),
          h('li', {}, 'Select the data, including the header row, and choose Insert → Chart.')),
        h('p', { class: 'small' }, 'Check that numbers landed as numbers, not text. If the chart is empty or the values sit on the left of the cells, use Format → Number. Paste your query and a screenshot of the result into your Google Doc before you move on.')));
    return shell(q, 'This one is open. No single right method. Use any tools you like, including AI.',
      h('div', { class: 'qs' }, memo, h('h3', {}, 'Your data'), dataLink, hint1, hint2, files, bonus,
        h('p', { class: 'small' }, 'Revenue is not in any one file. You\'ll need to JOIN them in SQLite Online, then chart the results in Sheets.'),
        S.bossStart ? timer : h('div', { class: 'actions' }, startBtn),
        h('h3', {}, 'Submit in one Google Doc'), checks,
        h('h3', {}, 'Your results card'), h('p', { class: 'small' }, 'Paste this at the top of your Google Doc, then join the live defense.'),
        out, h('div', { class: 'actions' }, copy, copyFb)));
  }

  // ---------- instructor mode ----------
  const ADMIN_HASH = '980f89cbce241a9d12cc5f9183bbfd64dd6ac09f87e6187a2388730394a19f08';
  let adminOpen = false;
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  function renderAdmin() {
    const box = $('#admin');
    box.innerHTML = '';
    if (S.admin) {
      box.append(
        h('span', { class: 'badge' }, 'Instructor mode: every quest unlocked'),
        h('button', { class: 'linkbtn', onclick: () => { S = fresh(); save(); q1order = null; render(); } }, 'Reset all progress'),
        h('button', { class: 'linkbtn', onclick: () => { S.admin = false; save(); render(); } }, 'Exit instructor mode'));
      return;
    }
    if (!adminOpen) {
      box.append(h('button', { class: 'linkbtn', onclick: () => { adminOpen = true; renderAdmin(); $('#admin-pw').focus(); } }, 'Instructor'));
      return;
    }
    const err = h('span', { class: 'err', 'aria-live': 'polite' });
    const pw = h('input', { id: 'admin-pw', type: 'password', placeholder: 'Password', autocomplete: 'off' });
    const go = async () => {
      let ok = false;
      try { ok = (await sha256(pw.value.trim())) === ADMIN_HASH; } catch (e) { err.textContent = 'This browser can\'t check the password.'; return; }
      if (!ok) { err.textContent = 'Wrong password.'; pw.select(); return; }
      S.admin = true;
      if (!S.startedAt) { S.name = S.name || 'Instructor'; S.startedAt = Date.now(); }
      adminOpen = false; save(); render();
    };
    pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    box.append(pw, h('button', { class: 'btn ghost', onclick: go }, 'Unlock'), h('button', { class: 'linkbtn', onclick: () => { adminOpen = false; renderAdmin(); } }, 'Cancel'), err);
  }

  // ---------- render ----------
  function render() {
    hud(); tick(); renderAdmin();
    const stage = $('#stage');
    stage.innerHTML = '';
    if (!S.startedAt) { stage.append(startScreen()); return; }
    if (!unlocked(S.current)) S.current = QUESTS.find(q => !isDone(q.id)).id;
    const q = QUESTS.find(x => x.id === S.current);
    const view = { q1: quest1, q2: quest2, q3: quest3, q4: quest4, q5: quest5, boss: bossQuest }[q.id](q);
    stage.append(view);
    bossTick();
  }
  render();
})();
</script>
